name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main    
  workflow_dispatch:

permissions:
  contents: write   
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      MOONBIT_INSTALL_VERSION: latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Reject legacy UI APIs
        run: |
          bash scripts/check_no_legacy_ui.sh

      - name: Build project
        run: moon build --target js --release --deny-warn

      - name: Collect Pages files
        run: |
          site="$RUNNER_TEMP/selene-pages"
          mkdir -p "$site"
          cp page/index.html "$site/index.html"
          cp -R --parents \
            examples/index.html examples/preload-assets.js \
            examples/*/index.html examples/*/screenshot.png examples/*/assets \
            _build/js/release/build/Milky2018/selene-examples-web/*/web/web.js \
            "$site"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/selene-pages
