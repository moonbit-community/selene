on:
  schedule:
    - cron: '0 10 * * 2'
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    env:
      MOONBIT_INSTALL_VERSION: latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Use MSVC on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure C compiler on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          echo "CC=cl" >> $env:GITHUB_ENV
          echo "CXX=cl" >> $env:GITHUB_ENV

      - name: Install MoonBit
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $env:MOONBIT_INSTALL_VERSION = "latest"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check generated ECS sources
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          moon update
          git ls-files -z -- '*.mbt' | xargs -0 moonx Milky2018/selene_codegen@0.40.0-beta1 --check

      - name: Test release workflow
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: python3 -m unittest discover -s tests -p 'test_publish.py'

      - name: Check formatting
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          moon fmt --check
          moon fmt publish.mbtx --check

      - name: selene-core
        run: |
          cd selene-core
          moon update
          moon check --deny-warn
          moon build

      - name: selene-webgpu
        run: |
          cd selene-webgpu
          moon update
          moon check --deny-warn
          moon build

      - name: selene-examples
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          cd examples
          moon update
          moon check --deny-warn

      - name: selene-examples-web
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          cd examples-web
          moon update
          moon check --target js --deny-warn

      - name: Test workspace
        run: moon test --deny-warn

  check-pre-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit pre-release
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s pre-release
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Check pre-release compatibility
        # Keep deprecation warnings visible while latest still requires the old syntax.
        run: |
          moon update
          moon check --target all
